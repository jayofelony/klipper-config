[include KAMP_Settings.cfg]

[extruder]
max_extrude_only_distance: 700.0
max_extrude_cross_section: 50.0
step_pin: PA7
dir_pin: PA6
enable_pin: !PC4
microsteps: 16
rotation_distance: 7.1910
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC9
# Stock Sensor:
sensor_type: EPCOS 100K B57560G104F
# E3D Sensor:
#sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PC0
#control: pid
#pid_Kp: 23.223
#pid_Ki: 1.518
#pid_Kd: 88.826
min_temp: 0
max_temp: 250
pressure_advance = 0.05

[filament_switch_sensor runout_sensor]
pause_on_runout: True
switch_pin: PA0

[neopixel extruder_led]
pin: PB7
chain_count: 1
color_order: GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

[input_shaper]
#shaper_freq_x: 84.4
#shaper_freq_y: 51.0
shaper_freq_x: 43.26
shaper_freq_y: 45.28
shaper_type: mzv

[stepper_x]
step_pin: !PB14
dir_pin: PB13
enable_pin: !PB15
microsteps: 16
rotation_distance: 40
endstop_pin: !PA2
position_endstop: 0
position_max: 220
homing_speed: 60

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB12
microsteps: 16
rotation_distance: 40
endstop_pin: !PA1
position_endstop: 0
position_max: 220
homing_speed: 60

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -5

[heater_bed]
heater_pin: PA8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
control: pid
pid_Kp: 23.223
pid_Ki: 1.518
pid_Kd: 88.826
min_temp: 0
max_temp: 130

[bed_screws]
screw1: 38,45
screw1_name: front left
screw2: 180,45
screw2_name: front right
screw3: 180,180
screw3_name: back right
screw4: 38,180
screw4_name: back left

[fan]
# PART fan: Koelt het geprinte plastic (Slicer gestuurd)
pin: PC8

[heater_fan hotend_fan]
# EXTR fan: Koelt de extruder/heatbreak (Automatisch boven 50 graden)
pin: PC7
heater: extruder
heater_temp: 50.0

[controller_fan stepper_fan]
# CASE fan: Koelt de elektronica en stappenmotoren onderin de printer
pin: PC6
idle_timeout: 300

# add the printer id here
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_1A0033001051383531393138-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 4000
max_z_velocity: 50
square_corner_velocity: 5.0
max_z_accel: 100

[bltouch]
sensor_pin: ^PC2 
control_pin: PC3 
x_offset:27.25
y_offset:-12.8
#z_offset: 0.25
speed:10
samples:1
samples_result:average


[bed_mesh]
speed: 800
mesh_min: 20, 20
mesh_max: 210, 210
probe_count: 5,5
algorithm: bicubic
move_check_distance: 3.0

[safe_z_home]
home_xy_position: 110,110
speed: 100
z_hop: 10
z_hop_speed: 5

[virtual_sdcard]
path: ~/printer_data/gcodes

[firmware_retraction]
retract_length: 1.4
# Een fractie hoger. Voor de Genius Pro direct-drive ligt de sweet spot 
# voor PLA/PETG bijna altijd tussen de 1.2 mm en 1.6 mm.

retract_speed: 45
# Verhoogd naar 45 mm/s om het vloeibare filament snel "af te breken".

unretract_speed: 40
# Cruciaal! Standaard staat dit op 10 mm/s. Door dit naar 40 mm/s te 
# verhogen, start de printer direct zonder te druppelen bij een nieuwe lijn.

unretract_extra_length: 0
# Laat deze altijd op 0 staan om te voorkomen dat er extra plastic 
# wordt doorgeduwd na een verplaatsing.

[display_status]

[pause_resume]

[exclude_object]

[gcode_macro _LED_HEATING]
gcode:
    SET_LED LED=extruder_led RED=1 GREEN=0 BLUE=0 TRANSMIT=1

[gcode_macro _LED_READY]
gcode:
    SET_LED LED=extruder_led RED=0 GREEN=1 BLUE=0 TRANSMIT=1

[gcode_macro _LED_PRINTING]
gcode:
    SET_LED LED=extruder_led RED=1 GREEN=1 BLUE=1 TRANSMIT=1

[gcode_macro _LED_PAUSED]
gcode:
    SET_LED LED=extruder_led RED=1 GREEN=0.5 BLUE=0 TRANSMIT=1

[gcode_macro START_PRINT]
gcode:
    # 1. Haal de temperaturen op die de slicer doorstuurt
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    # 2. Zet LED op rood en start direct met verwarmen
    _LED_HEATING
    M140 S{BED_TEMP}                         ; Start bedtemperatuur
    M104 S{EXTRUDER_TEMP}                    ; Start hotendtemperatuur

    # 3. Start de voorbereidingen tijdens het opwarmen
    M83                                      ; Extruder relative mode
    G90                                      ; Absolute Positioning
    G28                                      ; Home all axes
    
    # Adaptive mesh meet alleen het printoppervlak (vereist Klipper v0.12+)
    BED_MESH_CALIBRATE ADAPTIVE=1
    
    G1 Y0 F5000                              ; Verplaats naar de voorkant
    G1 X0 F5000                              ; Verplaats naar de oorsprong

    # 4. Wachten tot de doeltemperaturen echt zijn bereikt
    M190 S{BED_TEMP}                         ; Wacht op het bed
    M109 S{EXTRUDER_TEMP}                    ; Wacht op de extruder

    # 5. Temperaturen bereikt! LED wordt groen
    _LED_READY
    G92 E0                                   ; Reset extruder

    # 6. Start met printen! LED wordt wit net voor de purge line
    _LED_PRINTING
    LINE_PURGE                               ; KAMP Klipper Adaptive Purge Line
    G1 Z3 F3000                              ; Verplaats Z omhoog tegen krassen

[gcode_macro LAYER_CHANGE]
gcode:
  ;BEFORE_LAYER_CHANGE
  ;[layer_z]
  G92 E0

[gcode_macro END_PRINT]
gcode:
    G91                              ; Relative positioning
    G1 E-2 Z0.2 F2400                ; Retract and raise Z
    G1 X5 Y5 F3000                   ; Wipe out
    G1 Z10                           ; Raise Z more
    G90                              ; Absolute positioning
    G1 X0 Y200                       ; Present print (Gewijzigd naar Y200 zodat het bed helemaal naar voren komt!)
    
    # Heaters en fans uitschakelen
    M106 S0                          ; Turn-off fan
    M104 S0                          ; Turn-off hotend
    M140 S0                          ; Turn-off bed
    M84 X Y E                        ; Disable all steppers but Z

    # LED-status updaten
    _LED_READY                       ; Zet de LED op groen (veilig/klaar)
    # Optioneel: Vervang '_LED_READY' door 'LED_OFF' als je wilt dat het licht direct helemaal uitgaat.


[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
variable_extrude: 1.0
gcode:
  _LED_PAUSED                        ; Zet de LED direct op Oranje
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  _LED_PRINTING                      ; Zet de LED weer terug naar Wit
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  M106 S0                            ; Zet de part cooling fan uit
  CLEAR_PAUSE
  SDCARD_RESET_FILE
  
  G91                                ; Relatieve positionering
  G1 Z10 F3000                       ; Breng de Z-as 10mm omhoog voor veiligheid
  G90                                ; Absolute positionering
  G1 X0 Y200 F5000                   ; Schuif het bed naar voren
  
  M84 X Y E                          ; Schakel motoren uit (behalve Z)
  _LED_READY                         ; Zet de LED weer op groen
  CANCEL_PRINT_BASE

[gcode_macro LOAD_FILAMENT]
description: Verwarmt de hotend en laadt nieuw filament in het midden-voor
gcode:
    {% set EXTRUDER_TEMP = params.TEMP|default(220)|int %}
    
    SAVE_GCODE_STATE NAME=load_state
    M117 Positioneren...
    
    # Absolute positionering voor de assen
    G90 
    # Neem de helft van X voor het midden, en zet Y op 20 (voorzijde)
    G1 X{printer.toolhead.axis_maximum.x / 2} Y20 Z50 F3000
    
    # Controleer of de hotend al warm genoeg is, zo niet: verwarmen
    {% if printer.extruder.temperature < EXTRUDER_TEMP %}
        M117 Hotend verwarmen...
        M109 S{EXTRUDER_TEMP}
    {% endif %}
    
    M117 Laden starten...
    G91                             # Relatieve positionering voor extruder
    G92 E0                          # Reset extruder
    G1 E45 F300                     # Snel invoeren tot in de nozzle
    G1 E25 F150                     # Langzaam purgen om oude kleur te resten
    M400                            # Wacht tot beweging klaar is
    
    # Bed naar voren schuiven voor reiniging
    G90                             # Terug naar absolute positionering
    # PAS AAN: Vervang Y220 door de maximale Y-waarde van jouw printer
    G1 X{printer.toolhead.axis_maximum.x / 2} Y220 Z100 F3000 
    
    M117 Laden voltooid!
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
description: Verwarmt de hotend en trekt het filament volledig terug in het midden-voor
gcode:
    {% set EXTRUDER_TEMP = params.TEMP|default(220)|int %}
    
    SAVE_GCODE_STATE NAME=unload_state
    M117 Positioneren...
    
    # Absolute positionering voor de assen
    G90 
    # Neem de helft van X voor het midden, en zet Y op 20 (voorzijde)
    G1 X{printer.toolhead.axis_maximum.x / 2} Y20 Z50 F3000
    
    # Controleer of de hotend al warm genoeg is, zo niet: verwarmen
    {% if printer.extruder.temperature < EXTRUDER_TEMP %}
        M117 Hotend verwarmen...
        M109 S{EXTRUDER_TEMP}
    {% endif %}
    
    M117 Ontladen starten...
    G91                             # Relatieve positionering voor extruder
    G92 E0                          # Reset extruder
    G1 E4 F300                      # Kort aandrukken om tip te vormen
    G1 E-15 F2000                   # Snelle initiële retractie uit de smeltzone
    G1 E-45 F600                    # Rustig volledig eruit trekken
    M400                            # Wacht tot beweging klaar is
    
    # Bed naar voren schuiven voor reiniging
    G90                             # Terug naar absolute positionering
    # PAS AAN: Vervang Y220 door de maximale Y-waarde van jouw printer
    G1 X{printer.toolhead.axis_maximum.x / 2} Y220 Z100 F3000 
    
    M117 Ontladen voltooid!
    RESTORE_GCODE_STATE NAME=unload_state

